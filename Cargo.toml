[package]
name = "apex-drift"
version = "0.1.0"
edition = "2024"
description = "APEX DRIFT - stylized mobile drift racing game"
license = "MIT"

[dependencies]
bevy = "0.20.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
