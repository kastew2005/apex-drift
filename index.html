<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111820">
  <meta name="description" content="APEX DRIFT — mobile drift racing">
  <link rel="manifest" href="manifest.webmanifest">
  <link data-trunk rel="css" href="web/style.css">
  <link data-trunk rel="rust" data-wasm-opt="z">
  <title>APEX DRIFT</title>
</head>
<body>
  <div id="loading" aria-live="polite">
    <div class="brand">APEX <span>DRIFT</span></div>
    <div class="loading-line"></div>
    <p id="loading-message">INITIALIZING ENGINE</p>
  </div>
  <div id="mobile-controls" aria-hidden="true">
    <div class="steering">
      <div class="control-key left-key">◀<small>LEFT</small></div>
      <div class="control-key right-key">▶<small>RIGHT</small></div>
    </div>
    <div class="handbrake control-key">HANDBRAKE</div>
    <div class="pedals">
      <div class="control-key brake-key">BRAKE</div>
      <div class="control-key gas-key">GAS</div>
    </div>
  </div>
  <script>
    (() => {
      const loading = document.getElementById("loading");
      const message = document.getElementById("loading-message");
      let started = false;

      const checkCanvas = () => {
        if (started) return;
        const canvas = document.querySelector("canvas");
        if (canvas) {
          started = true;
          loading?.classList.add("hidden");
          return;
        }
        requestAnimationFrame(checkCanvas);
      };

      requestAnimationFrame(checkCanvas);

      window.setTimeout(() => {
        if (!document.querySelector("canvas")) {
          if (message) message.textContent = "ENGINE DID NOT START — RELOAD THE PAGE";
          loading?.classList.add("error");
        }
      }, 25000);
    })();
  </script>
</body>
</html>
